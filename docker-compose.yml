services:

  # =========================================================
  # MYSQL
  # =========================================================
  mysql:
    image: mysql:8.0
    container_name: uajs-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ""
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: uajs_smart_campus

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/uajs_smart_campus.sql:/docker-entrypoint-initdb.d/uajs_smart_campus.sql:ro

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================================================
  # API GATEWAY
  # =========================================================
  gateway:
    build:
      context: ./backend/gateway
      dockerfile: Dockerfile

    container_name: uajs-gateway
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: uajs_smart_campus
      PORT: 3000

    ports:
      - "3000:3000"

    depends_on:
      mysql:
        condition: service_healthy


  # =========================================================
  # AUTH SERVICE
  # =========================================================
  auth-service:
    build:
      context: ./backend/services/auth-service
      dockerfile: Dockerfile

    container_name: uajs-auth-service
    restart: unless-stopped

    env_file:
      - .env

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ""
      DB_NAME: uajs_smart_campus
      PORT: 3001

    ports:
      - "3001:3001"

    depends_on:
      mysql:
        condition: service_healthy


  # =========================================================
  # USERS SERVICE
  # =========================================================
  users-service:
