    depends_on:
      mysql:
        condition: service_healthy


  frontend-dev:
    # =========================================================
    # FRONTEND - Desarrollo con hot-reload
    # =========================================================
    build:
      context: ./frontend
      dockerfile: dockerfile.dev
    container_name: uajs-frontend-dev
    restart: unless-stopped

    environment:
      VITE_API_URL: http://localhost:3000/api
      NODE_ENV: development

    ports:
      - "5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules  # node_modules del contenedor (no el del host)

# =========================================================
# VOLUMES
# =========================================================
volumes:
  mysql_data:
  frontend_node_modules: